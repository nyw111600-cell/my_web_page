name: Auto Sync 10-Day Trade Statistics

on:
  schedule:
    # 월~금 한국시간(KST) 09:30, 12:00, 15:00 자동 실행 (UTC 00:30, 03:00, 06:00)
    - cron: '30 0,3,6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-trade-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          pip install requests openpyxl urllib3

      - name: Fetch Latest Trade Data from tradedata.go.kr & Rebuild Dashboard
        run: python scripts/fetch_tradedata_auto.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trade/ trade_10days.html
          git diff --staged --quiet || (git commit -m "Auto: Update 10-day trade data from tradedata.go.kr [skip ci]" && git push)
