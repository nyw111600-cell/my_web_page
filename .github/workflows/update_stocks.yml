name: Update Semiconductor Stock Prices

on:
  schedule:
    # GitHub 서버 큐 적체(정각/30분 트래픽 집중)를 피해 매시 12분, 42분에 분산 실행 (KST 09:12~14:42)
    - cron: '12,42 0-5 * * 1-5'
    # KST 15:35 장 마감 직후 확정 종가 및 16:00 시간외 마감 반영 (UTC 06:35, 07:00)
    - cron: '35 6 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Quotes from Naver Finance API & Update HTML/JSON
        run: node scripts/update_stocks.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add semiconductor_stock_returns.html stocks_data.json
          git diff --staged --quiet || (git commit -m "Auto: Update KRX semiconductor stock prices from Naver Finance [skip ci]" && git push)
