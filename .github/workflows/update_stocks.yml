name: Update Semiconductor Stock Prices

on:
  schedule:
    - cron: '*/30 0-6 * * 1-5'
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Quotes from Naver Finance API & Update HTML/JSON
        run: node scripts/update_stocks.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add semiconductor_stock_returns.html stocks_data.json
          git diff --staged --quiet || (git commit -m "Auto: Update KRX semiconductor stock prices from Naver Finance [skip ci]" && git push)
